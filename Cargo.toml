[workspace]
members = [
    "crates/media-rip-core",
    "crates/media-rip-engine",
    "crates/media-rip-native",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
gtk = { package = "gtk4", version = "0.10" }
gdk-pixbuf = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64 = "0.22"
sha1 = "0.10"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
